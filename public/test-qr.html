<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码登录测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .qr-container {
            text-align: center;
            margin: 20px 0;
        }
        .qr-image {
            max-width: 200px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background-color: #f0f0f0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>二维码登录测试</h1>
    
    <div>
        <button onclick="getQrKey()">1. 获取二维码Key</button>
        <button onclick="createQr()">2. 生成二维码</button>
        <button onclick="checkStatus()">3. 检查状态</button>
    </div>
    
    <div class="status" id="status">点击按钮开始测试...</div>
    
    <div class="qr-container">
        <img id="qrImage" class="qr-image" style="display: none;" />
    </div>

    <script>
        let qrKey = '';
        const API_BASE = 'https://beifang.dpdns.org';
        
        async function getQrKey() {
            try {
                const response = await fetch(`${API_BASE}/login/qr/key?timestamp=${Date.now()}`);
                const data = await response.json();
                console.log('Key响应:', data);
                
                if (data && data.data && data.data.unikey) {
                    qrKey = data.data.unikey;
                    document.getElementById('status').innerHTML = `✅ 获取Key成功: ${qrKey}`;
                } else {
                    document.getElementById('status').innerHTML = `❌ 获取Key失败: ${JSON.stringify(data)}`;
                }
            } catch (error) {
                console.error('获取Key失败:', error);
                document.getElementById('status').innerHTML = `❌ 获取Key失败: ${error.message}`;
            }
        }
        
        async function createQr() {
            if (!qrKey) {
                document.getElementById('status').innerHTML = '❌ 请先获取二维码Key';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/login/qr/create?key=${qrKey}&qrimg=true&timestamp=${Date.now()}`);
                const data = await response.json();
                console.log('二维码响应:', data);
                
                if (data && data.data && data.data.qrimg) {
                    const qrImage = document.getElementById('qrImage');
                    qrImage.src = data.data.qrimg;
                    qrImage.style.display = 'block';
                    document.getElementById('status').innerHTML = '✅ 二维码生成成功！请使用网易云音乐APP扫描';
                } else {
                    document.getElementById('status').innerHTML = `❌ 二维码生成失败: ${JSON.stringify(data)}`;
                }
            } catch (error) {
                console.error('生成二维码失败:', error);
                document.getElementById('status').innerHTML = `❌ 生成二维码失败: ${error.message}`;
            }
        }
        
        async function checkStatus() {
            if (!qrKey) {
                document.getElementById('status').innerHTML = '❌ 请先获取二维码Key';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/login/qr/check?key=${qrKey}&timestamp=${Date.now()}`);
                const data = await response.json();
                console.log('状态响应:', data);
                
                const statusMessages = {
                    800: '❌ 二维码已过期',
                    801: '⏳ 等待扫码',
                    802: '📱 待确认',
                    803: '✅ 登录成功'
                };
                
                const message = statusMessages[data.code] || `状态码: ${data.code}`;
                document.getElementById('status').innerHTML = `${message} - ${JSON.stringify(data)}`;
            } catch (error) {
                console.error('检查状态失败:', error);
                document.getElementById('status').innerHTML = `❌ 检查状态失败: ${error.message}`;
            }
        }
    </script>
</body>
</html>

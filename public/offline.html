<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicX - 离线模式</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1DB954;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #18a64a;
        }

        .cached-music {
            margin-top: 30px;
            text-align: left;
        }

        .cached-music h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🎵</div>
        <h1>MusicX 离线模式</h1>
        <p>您当前处于离线状态，无法连接到服务器。您仍然可以播放已缓存的音乐。</p>
        <button class="button" onclick="window.location.reload()">重新连接</button>

        <div class="cached-music">
            <h2>已缓存的音乐</h2>
            <p>您可以通过主页访问已缓存的音乐。</p>
        </div>
    </div>

    <script>
        // 检测网络连接状态
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>

</html>
